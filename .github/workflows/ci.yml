name: CI

# Runs on every push: checks code style. Tests are run locally while learning,
# because unfinished exercises are expected to fail until you solve them.
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
